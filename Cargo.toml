[package]
name = "github-stacked-pr-validator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
futures = "0.3"
leptos = { version = "0.8.23", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.8", features = ["http"] }
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "HtmlInputElement"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
